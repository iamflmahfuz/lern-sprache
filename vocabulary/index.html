<body>


<header class="header">

    <div class="container nav-container">

        <a href="../index.html" class="logo">
            Lern <span>Sprache</span>
        </a>

        <nav class="navbar">

            <a href="../index.html">Home</a>

            <a href="../index.html#courses">
                Courses
            </a>

            <a href="index.html">
                Vocabulary
            </a>

        </nav>

        <button class="menu-btn" id="menuBtn">
            ☰
        </button>

    </div>

</header>



<section class="course-detail-hero">

    <div class="container">

        <div class="section-heading">

            <span class="section-label">
                Wortschatz
            </span>

            <h1>
                German Vocabulary
            </h1>

            <p>
                Learn German words with English and Bangla meanings.
            </p>

        </div>


        <!-- SEARCH -->

        <div class="vocabulary-controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search German, English or Bangla..."
            >


            <select id="levelFilter">

                <option value="A1">
                    A1
                </option>

                <option value="A2">
                    A2
                </option>

                <option value="B1">
                    B1
                </option>

                <option value="ALL">
                    All Levels
                </option>

            </select>


            <select id="typeFilter">

                <option value="ALL">
                    All Types
                </option>

                <option value="Nomen">
                    Nomen
                </option>

                <option value="Verb">
                    Verben
                </option>

                <option value="Adjektiv">
                    Adjektive
                </option>

                <option value="Adverb">
                    Adverbien
                </option>

                <option value="Expression">
                    Expressions
                </option>

            </select>
            <select id="categoryFilter">
                <option value="all">All categories</option>option>
            </select>   
            

        </div>

    </div>

</section>



<section class="section">

    <div class="container">

        <div
            id="vocabularyContainer"
            class="vocabulary-grid"
        >

            <p class="loading">
                Loading vocabulary...
            </p>

        </div>

    </div>

</section>



<footer class="footer">

        <div>

        </div>

        <div>

            <h3>
                Learn
            </h3>

            <a href="index.html">
                Wortschatz

            <a href="#">
                Grammatik
            </a>

        </div>

    </div>


    <div class="copyright">

        <p>

    </div>
